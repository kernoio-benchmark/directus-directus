services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=directus"
      - "POSTGRES_PASSWORD=directus"
      - "POSTGRES_DB=directus"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U directus -d directus"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/directus?user=directus&password=directus

  redis:
    image: redis:8.4.0-alpine
    pull_policy: missing
    ports:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data
    labels:
      - external-url=redis://localhost:{{PORT}}

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # syntax=docker/dockerfile:1.4

        ARG NODE_VERSION=22

        ####################################################################################################
        ## Build Packages

        FROM node:$${NODE_VERSION}-alpine AS builder

        # Remove again once corepack >= 0.31 made it into base image
        # (see https://github.com/directus/directus/issues/24514)
        RUN npm install --global corepack@latest

        RUN apk --no-cache add python3 py3-setuptools build-base

        WORKDIR /directus

        COPY package.json .
        RUN corepack enable && corepack prepare

        # Deploy as 'node' user to match pnpm setups in production image
        # (see https://github.com/directus/directus/issues/23822)
        RUN chown node:node .
        USER node

        ENV NODE_OPTIONS=--max-old-space-size=8192

        COPY pnpm-lock.yaml .
        RUN pnpm fetch

        COPY --chown=node:node . .
        RUN <<EOF
        	set -ex
        	pnpm install --recursive --offline --frozen-lockfile
        	npm_config_workspace_concurrency=2 pnpm run build
        	pnpm --filter directus deploy --legacy --prod dist
        	cd dist
        	# Regenerate package.json file with essential fields only
        	# (see https://github.com/directus/directus/issues/20338)
        	node -e '
        		const f = "package.json", {name, version, type, exports, bin} = require(`./$${f}`), {packageManager} = require(`../$${f}`);
        		fs.writeFileSync(f, JSON.stringify({name, version, type, exports, bin, packageManager}, null, 2));
        	'
        	mkdir -p database extensions uploads
        EOF

        ####################################################################################################
        ## Create Production Image

        FROM node:$${NODE_VERSION}-alpine AS runtime

        RUN npm install --global \
        	pm2@5 \
        	corepack@latest # Remove again once corepack >= 0.31 made it into base image

        USER node

        WORKDIR /directus

        ENV \
        	DB_CLIENT="sqlite3" \
        	DB_FILENAME="/directus/database/database.sqlite" \
        	NODE_ENV="production" \
        	NPM_CONFIG_UPDATE_NOTIFIER="false"

        COPY --from=builder --chown=node:node /directus/ecosystem.config.cjs .
        COPY --from=builder --chown=node:node /directus/dist .

        EXPOSE 8055

        CMD : \
        	&& node cli.js bootstrap \
        	&& pm2-runtime start ecosystem.config.cjs \
        	;
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8055"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
